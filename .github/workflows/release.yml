# Publishes a version of the provider from GitHub:
#   1. a GitHub release with the zips, SHA256SUMS, its GPG signature and the
#      Terraform registry manifest (the Terraform Registry ingests these once the
#      provider is listed there), and
#   2. a "provider mirror" container image in GitHub Packages:
#      ghcr.io/<owner>/<repo>:<version> (see packaging/Dockerfile).
# GitLab publishes the same version to its own package registry (.gitlab-ci.yml).
#
# Start it either way:
#   - push a tag:      git tag v0.1.0 && git push github v0.1.0
#   - or Actions > Release > Run workflow on the default branch: it creates the
#     next tag (patch/minor/major bump, or the exact version you type) and
#     releases it in the same run.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   GPG_PRIVATE_KEY  armored private key (or its base64), RSA
#   GPG_PASSPHRASE   passphrase of that key (leave unset if it has none)
#   GIT_TOKEN        optional fine-grained token (Contents: read/write) for the
#                    release; the built-in GITHUB_TOKEN is used when it is unset
name: Release

on:
  push:
    tags:
      # vX.Y.Z, plus pre-releases such as v1.2.0-rc.1
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump from the latest vX.Y.Z tag (ignored when version is set)"
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version to release instead, e.g. v1.2.0 or v1.2.0-rc.1"
        type: string
        required: false

# contents: create the tag and the release; packages: push to ghcr.io.
permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  prepare:
    name: Resolve release tag
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine (and for manual runs, create) the tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "Releasing pushed tag ${GITHUB_REF_NAME}"
            exit 0
          fi
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run the release from the default branch (${DEFAULT_BRANCH})."
            exit 1
          fi
          if [ -z "$VERSION" ]; then
            LAST=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            LAST=${LAST:-v0.0.0}
            IFS=. read -r MAJ MIN PAT <<< "${LAST#v}"
            case "$BUMP" in
              major) VERSION="v$((MAJ + 1)).0.0" ;;
              minor) VERSION="v${MAJ}.$((MIN + 1)).0" ;;
              *)     VERSION="v${MAJ}.${MIN}.$((PAT + 1))" ;;
            esac
            echo "Latest release ${LAST}; ${BUMP} bump -> ${VERSION}"
          fi
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must look like v1.2.3 or v1.2.3-rc.1 (got '${VERSION}')."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists."
            exit 1
          fi
          # Pushed with the built-in GITHUB_TOKEN, so it does not start this
          # workflow a second time; the jobs below release it in this run.
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Created tag ${VERSION} at ${GITHUB_SHA}"

  goreleaser:
    name: GitHub release and package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          # GoReleaser needs the tags and history for the version and changelog.
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: GoReleaser (GitHub release)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Keep in sync with GORELEASER_VERSION in .gitlab-ci.yml.
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.prepare.outputs.tag }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Image name and tags
        id: image
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            # Only final versions move "latest"; pre-releases keep their own tag.
            case "$VERSION" in *-*) ;; *) echo "${IMAGE}:latest" ;; esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish provider mirror image to GitHub Packages
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/Dockerfile
          # The image only holds files, so every platform gets the same content;
          # listing several lets COPY --from work on amd64 and arm64 builders.
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=terraform-provider-artisanvirt
            org.opencontainers.image.description=Artisan Virt Terraform provider ${{ needs.prepare.outputs.tag }} in Terraform local-mirror layout (/plugins)
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Keep the package page to the two platform images.
          provenance: false
          push: true

      - name: Summary
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          {
            echo "### Released ${TAG}"
            echo "- GitHub release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- Package: \`${IMAGE}:${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
