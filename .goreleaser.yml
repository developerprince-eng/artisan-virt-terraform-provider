# GoReleaser configuration for the Terraform Registry.
# Layout follows HashiCorp's provider scaffolding: zip per platform, a SHA256SUMS
# file, its detached GPG signature, and the registry manifest.
# Docs: https://developer.hashicorp.com/terraform/registry/providers/publishing
version: 2

# The registry requires the terraform-provider-<NAME> prefix; the folder name
# of this repository must not leak into artifact names.
project_name: terraform-provider-artisanvirt

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, "386"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  # The registry verifies <name>_SHA256SUMS.sig against the public key
  # registered for the namespace. The key is imported in CI (see .gitlab-ci.yml).
  - artifacts: checksum
    stdin: '{{ envOrDefault "GPG_PASSPHRASE" "" }}'
    args:
      - --batch
      - --yes
      - --pinentry-mode
      - loopback
      - --passphrase-fd
      - "0"
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

# Publishing is split by host:
#   GitHub Actions (.github/workflows/release.yml) runs `goreleaser release`,
#     which creates the GitHub release the Terraform Registry ingests. The
#     repository is taken from the checkout's origin remote.
#   GitLab CI (.gitlab-ci.yml) runs `goreleaser release --skip=publish` and
#     uploads dist/ to the GitLab Generic Package Registry itself.
release:
  # vX.Y.Z-rc.1 and similar tags become GitHub pre-releases; the registry
  # serves them only to configurations that pin the exact version.
  prerelease: auto
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge branch"

snapshot:
  # Stable names between releases, so the GitLab "latest" package is refreshed
  # in place instead of collecting one set of files per commit.
  version_template: "{{ incpatch .Version }}-dev"
