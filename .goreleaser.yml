# GoReleaser configuration for the Terraform Registry.
# Layout follows HashiCorp's provider scaffolding: zip per platform, a SHA256SUMS
# file, its detached GPG signature, and the registry manifest.
# Docs: https://developer.hashicorp.com/terraform/registry/providers/publishing
version: 2

# The registry requires the terraform-provider-<NAME> prefix; the folder name
# of this repository must not leak into artifact names.
project_name: terraform-provider-artisanvirt

builds:
  - env:
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm, "386"]
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"

signs:
  # The registry verifies <name>_SHA256SUMS.sig against the public key
  # registered for the namespace. The key is imported in CI (see .gitlab-ci.yml).
  - artifacts: checksum
    stdin: '{{ envOrDefault "GPG_PASSPHRASE" "" }}'
    args:
      - --batch
      - --yes
      - --pinentry-mode
      - loopback
      - --passphrase-fd
      - "0"
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

# Publishing is split by host:
#   GitHub Actions (.github/workflows/release.yml) runs `goreleaser release`,
#     which creates the GitHub release the Terraform Registry ingests. The
#     repository is taken from the checkout's origin remote.
#   GitLab CI (.gitlab-ci.yml) runs `goreleaser release --skip=publish` and
#     uploads dist/ to the GitLab Generic Package Registry itself.
release:
  # vX.Y.Z-rc.1 and similar tags become GitHub pre-releases; the registry
  # serves them only to configurations that pin the exact version.
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  # Install instructions on every GitHub release page. The registry address
  # must match RegistryAddress in internal/provider/provider.go.
  header: |
    ## Install from the Terraform Registry

    ```hcl
    terraform {
      required_providers {
        artisanvirt = {
          source  = "developerprince/artisanvirt"
          version = "{{ .Version }}"
        }
      }
    }
    ```

    Then run `terraform init`. Registry page: https://registry.terraform.io/providers/developerprince/artisanvirt/{{ .Version }}
  footer: |
    ## Install from this release (offline or air-gapped)

    Download the zip for your platform and `SHA256SUMS` from the assets below, verify them, and place the
    zip in Terraform's local plugin mirror. No registry access or token is needed.

    ```sh
    VERSION={{ .Version }}
    PLATFORM=linux_amd64   # linux_arm64, darwin_arm64, darwin_amd64, windows_amd64, ...
    BASE=https://github.com/{{ envOrDefault "GITHUB_REPOSITORY" "developerprince/terraform-provider-artisanvirt" }}/releases/download/{{ .Tag }}
    curl -fLO "$BASE/{{ .ProjectName }}_${VERSION}_${PLATFORM}.zip"
    curl -fLO "$BASE/{{ .ProjectName }}_${VERSION}_SHA256SUMS"
    curl -fLO "$BASE/{{ .ProjectName }}_${VERSION}_SHA256SUMS.sig"
    gpg --verify {{ .ProjectName }}_${VERSION}_SHA256SUMS.sig {{ .ProjectName }}_${VERSION}_SHA256SUMS
    grep "_${PLATFORM}.zip" {{ .ProjectName }}_${VERSION}_SHA256SUMS | sha256sum -c -
    DIR=~/.terraform.d/plugins/registry.terraform.io/developerprince/artisanvirt
    mkdir -p "$DIR" && mv {{ .ProjectName }}_${VERSION}_${PLATFORM}.zip "$DIR/"
    ```

    `SHA256SUMS` is signed with the key `6B0B6A4CD2811E216A9D898721806376C7816FDA`; its public key is
    `artisanvirt-signing.pub.asc` in the repository (`gpg --import artisanvirt-signing.pub.asc`).
    Windows (PowerShell) steps are in the repository README under "Installing → From GitHub Releases".

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge branch"

snapshot:
  # Stable names between releases, so the GitLab "latest" package is refreshed
  # in place instead of collecting one set of files per commit.
  version_template: "{{ incpatch .Version }}-dev"
